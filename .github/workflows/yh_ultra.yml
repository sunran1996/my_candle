name: YH_ultra Stock Tracker

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei fonts-wqy-microhei
      - name: Install python deps
        run: pip install akshare pandas numpy matplotlib mplfinance
      - name: Run YH_ultra tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python YH_ultra/daily_signal.py
