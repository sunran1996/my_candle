name: YH08 Daily Signal

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30, 周一~周五 (A股收盘后)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # 允许 GITHUB_TOKEN 回写 _positions.json / 代码 / 图表

jobs:
  daily-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: yh08-daily
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai                # 让脚本里 today / in_session 按北京时间算
      GH_TOKEN: ${{ github.token }}    # 供脚本回写 GitHub 用
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          python -m pip install --upgrade pip
          pip install akshare pandas numpy matplotlib mplfinance

      - name: Run daily signal
        run: python YH08/daily_signal.py --live
